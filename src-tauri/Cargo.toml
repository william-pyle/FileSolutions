[package]
name = "filesolutions"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "filesolutions"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
filesolutions-core = { path = "../crates/filesolutions-core" }
filesolutions-windows = { path = "../crates/filesolutions-windows" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rfd = "0.15"
windows = { workspace = true, features = ["Win32_UI_HiDpi"] }
